{% extends "base.html" %}

{% block title %}Register — FaceGuard{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container wide">
        <div class="auth-header">
            <h2>Create Your Account</h2>
            <p>Register your face for secure biometric authentication</p>
        </div>

        <!-- Step Indicators -->
        <div class="login-steps">
            <div class="step active" id="step-1">
                <div class="step-number">1</div>
                <span>Your Info</span>
            </div>
            <div class="step-connector"></div>
            <div class="step" id="step-2">
                <div class="step-number">2</div>
                <span>Capture Face</span>
            </div>
            <div class="step-connector"></div>
            <div class="step" id="step-3">
                <div class="step-number">3</div>
                <span>Confirm</span>
            </div>
        </div>

        <!-- Status Container -->
        <div id="status-container" class="hidden"></div>

        <!-- Step 1: User Info Form -->
        <div id="step-form" class="glass-card">
            <div class="form-group">
                <label class="form-label" for="reg-name">Full Name</label>
                <input type="text" id="reg-name" class="form-input" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="reg-email">Email Address</label>
                <input type="email" id="reg-email" class="form-input" placeholder="Enter your email" required>
            </div>
            <button id="next-step-btn" class="btn btn-primary btn-lg w-full mt-2">
                Continue to Face Capture →
            </button>
        </div>

        <!-- Step 2: Camera Capture -->
        <div id="step-camera" class="glass-card hidden">
            <div class="camera-container">
                <video id="reg-video" autoplay playsinline muted></video>
                <div class="camera-overlay">
                    <div class="camera-scan-line"></div>
                    <div class="camera-corners"><span></span></div>
                </div>
                <div class="camera-status active">Camera Active</div>
            </div>
            <div class="text-center mt-3">
                <button id="capture-btn" class="btn btn-primary btn-lg">
                    📸 Capture Face
                </button>
            </div>
        </div>

        <!-- Step 3: Confirm & Submit -->
        <div id="step-confirm" class="glass-card hidden text-center">
            <h3 class="mb-2">Review Your Photo</h3>
            <div style="max-width: 300px; margin: 0 auto; border-radius: var(--radius-lg); overflow: hidden; border: 2px solid var(--border);">
                <img id="captured-preview" src="" alt="Captured face" style="width: 100%; display: block;">
            </div>
            <div class="d-flex justify-between mt-3 gap-2" style="justify-content: center;">
                <button id="retake-btn" class="btn btn-secondary">
                    🔄 Retake
                </button>
                <button id="submit-btn" class="btn btn-primary btn-lg">
                    ✓ Register
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/register.js') }}"></script>
{% endblock %}
