version: '3.8'

services:
  web:
    build: .
    container_name: faceguard_app
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=enterprise-super-secret-key-change-in-prod
      - FLASK_ENV=production
      - SMTP_SERVER=smtp.gmail.com
      - SMTP_PORT=465
      - SMTP_USE_TLS=true
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
